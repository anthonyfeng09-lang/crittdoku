<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset="0.5" stop-color="#fdf0ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.28" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- mini board -->
  <g transform="translate(792 132)">
    <rect x="0" y="0" width="300" height="300" rx="26" fill="#fef9ff" stroke="#2b2233" stroke-width="6"/>
    <rect x="34"  y="34"  width="66" height="66" rx="12" fill="#22c55e"/>
    <rect x="200" y="34"  width="66" height="66" rx="12" fill="#a855f7"/>
    <rect x="117" y="117" width="66" height="66" rx="12" fill="#f59e0b"/>
    <rect x="34"  y="200" width="66" height="66" rx="12" fill="#f43f5e"/>
    <rect x="200" y="200" width="66" height="66" rx="12" fill="#fb923c"/>
    <g stroke="#2b2233" stroke-width="5" stroke-linecap="round" opacity="0.9">
