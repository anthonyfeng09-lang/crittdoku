    </g>
  </g>

  <text x="96" y="300" font-family="Verdana, Geneva, sans-serif" font-size="128" font-weight="900" fill="url(#word)" letter-spacing="4">CRITTDOKU</text>
  <text x="100" y="360" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="700" fill="#5b5566">a quiet duel on a shared grid</text>

  <g transform="translate(100 430)">
    <rect x="0"   y="0" width="54" height="54" rx="14" fill="#22c55e" stroke="#2b2233" stroke-width="4"/>
    <rect x="70"  y="0" width="54" height="54" rx="14" fill="#06b6d4" stroke="#2b2233" stroke-width="4"/>
    <rect x="140" y="0" width="54" height="54" rx="14" fill="#a855f7" stroke="#2b2233" stroke-width="4"/>
    <rect x="210" y="0" width="54" height="54" rx="14" fill="#f59e0b" stroke="#2b2233" stroke-width="4"/>
    <rect x="280" y="0" width="54" height="54" rx="14" fill="#f43f5e" stroke="#2b2233" stroke-width="4"/>
    <rect x="350" y="0" width="54" height="54" rx="14" fill="#fb923c" stroke="#2b2233" stroke-width="4"/>
    <text x="424" y="38" font-family="Verdana, Geneva, sans-serif" font-size="28" font-weight="700" fill="#5b5566">36 critters &#183; six types</text>
